# The ci-kit reusable workflow (spec §1). Callers use it through the two-file onboarding in docs/adopting.md:
#   jobs: {ci: {uses: SSFSKIM/ci-kit/.github/workflows/gates.yml@v1, secrets: inherit}}
# plan reads the caller's .github/ci-kit.yml and selects gates; gate runs one matrix job per selected gate;
# verdict is the one stable check, green only when every selected gate is.
name: gates

on:
  workflow_call:

permissions:
  contents: read

# A newer push to a PR cancels the older run; every other run (each ci-gate call has its own ref) has a group of its own.
concurrency:
  group: ci-kit-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gates: ${{ steps.plan.outputs.gates }}
      count: ${{ steps.plan.outputs.count }}
      pool: ${{ steps.plan.outputs.pool }}
      note: ${{ steps.plan.outputs.note }}
      base: ${{ steps.plan.outputs.base }}
      cache_write: ${{ steps.plan.outputs.cache_write }}
      apt_cache: ${{ steps.plan.outputs.apt_cache }}
      apt_warm: ${{ steps.plan.outputs.apt_warm }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the change basis needs the base's history
          filter: blob:none
          persist-credentials: false

      # Inside a reusable workflow `./` is the caller's repo, so the planner is checked out from the kit at the
      # very commit this workflow file came from: planner and workflow always run at the same version.
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-kit
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install the planner
        working-directory: .ci-kit
        run: npm ci --omit=dev --no-audit --no-fund --loglevel=error

      - name: Plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_KIT_CONFIG: .github/ci-kit.yml
          CI_KIT_PRIVATE: ${{ github.event.repository.private }}
          CI_KIT_GATES: ${{ github.event.inputs.gates }}
          CI_KIT_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          CI_KIT_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          fail() { echo "::error::${1//%/%25}"; exit 2; }
          case $EVENT_NAME in
            pull_request) export CI_KIT_EVENT=pr CI_KIT_BASE=$PR_BASE CI_KIT_HEAD=$PR_HEAD ;;
            push)
              if [[ $GITHUB_REF == refs/heads/ci/* ]]; then
                base=$(git rev-parse --verify "origin/$DEFAULT_BRANCH") || fail "ci-kit: no default branch origin/$DEFAULT_BRANCH to diff against"
                export CI_KIT_EVENT=ci-ref CI_KIT_BASE=$base CI_KIT_HEAD=$GITHUB_SHA
              elif [[ $GITHUB_REF == "refs/heads/$DEFAULT_BRANCH" ]]; then
                # A merge seeds the build cache (docs/adopting.md, "Build cache"): the build_cache gates whose paths the
                # push changed, against the branch's tip before it. When that tip is all zeros (a new branch), absent
                # from the checkout or not an ancestor (a force push), the base stays empty and every one of them seeds.
                base=
                if [[ ! $PUSH_BEFORE =~ ^0+$ ]] && git merge-base --is-ancestor "$PUSH_BEFORE" "$GITHUB_SHA" 2>/dev/null; then
                  base=$PUSH_BEFORE
                fi
                export CI_KIT_EVENT=push CI_KIT_BASE=$base CI_KIT_HEAD=$GITHUB_SHA
              else
                fail "ci-kit: a push is planned only on ci/** refs and the default branch, not $GITHUB_REF"
              fi ;;
            workflow_dispatch) export CI_KIT_EVENT=dispatch CI_KIT_BASE= CI_KIT_HEAD= ;;
            # The build cache's seeding run (docs/adopting.md, "Build cache"). A schedule has no event payload, so the
            # repository's visibility and default branch come from the API.
            schedule)
              repo=$(curl -fsS --retry 3 -H "Authorization: Bearer $CI_KIT_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY") \
                || fail "ci-kit: a schedule could not read $GITHUB_REPOSITORY's visibility and default branch"
              CI_KIT_PRIVATE=$(jq -r .private <<<"$repo") DEFAULT_BRANCH=$(jq -r .default_branch <<<"$repo")
              export CI_KIT_PRIVATE CI_KIT_EVENT=schedule CI_KIT_BASE= CI_KIT_HEAD= ;;
            *) fail "ci-kit: event $EVENT_NAME is not planned (pull_request, push to ci/** or the default branch, workflow_dispatch, schedule)" ;;
          esac
          unset CI_KIT_TOKEN
          # The planner writes the build cache only on the default branch.
          export CI_KIT_REF=$GITHUB_REF CI_KIT_DEFAULT_BRANCH=$DEFAULT_BRANCH
          # The gates' CI_KIT_BASE: where the commit they check out ($GITHUB_SHA) left the base, so that a two-dot
          # `git diff $CI_KIT_BASE $CI_KIT_HEAD` is the change. Empty when the event has no change basis.
          gate_base=
          if [[ -n $CI_KIT_BASE ]]; then
            gate_base=$(git merge-base "$CI_KIT_BASE" "$GITHUB_SHA") || fail "ci-kit: no merge-base of $CI_KIT_BASE and $GITHUB_SHA"
          fi
          status=0
          node .ci-kit/plan/plan.mjs > "$RUNNER_TEMP/plan.json" 2> "$RUNNER_TEMP/plan.err" || status=$?
          cat "$RUNNER_TEMP/plan.err" >&2
          if (( status != 0 )); then
            # Each planner message becomes an error annotation, which ci-gate reads back and prints.
            while IFS= read -r line; do
              [[ $line == ci-kit:* ]] && echo "::error::${line//%/%25}"
            done < "$RUNNER_TEMP/plan.err"
            exit "$status"
          fi
          jq . "$RUNNER_TEMP/plan.json"
          {
            echo "gates=$(jq -c .gates "$RUNNER_TEMP/plan.json")"
            echo "count=$(jq '.gates | length' "$RUNNER_TEMP/plan.json")"
            echo "pool=$(jq .pool "$RUNNER_TEMP/plan.json")"
            echo "note=$(jq -r .note "$RUNNER_TEMP/plan.json")"
            echo "base=$gate_base"
            echo "cache_write=$(jq .cache_write "$RUNNER_TEMP/plan.json")"
            echo "apt_cache=$(jq -r .apt_cache "$RUNNER_TEMP/plan.json")"
            echo "apt_warm=$(jq -c .apt_warm "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_OUTPUT"

      # A pool gate needs the pool box: ensure creates it if none exists, without waiting for it to boot (spec §3).
      # It runs from the kit checkout, so it is at this workflow's version, like the planner.
      - name: Pool
        if: steps.plan.outputs.pool == 'true'
        uses: ./.ci-kit/pool-ensure

  gate:
    name: ${{ matrix.gate.name }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.plan.outputs.gates) }}
    runs-on: ${{ matrix.gate.runs_on }}
    timeout-minutes: ${{ matrix.gate.timeout }}
    env: ${{ matrix.gate.env }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.gate.setup.fetch_depth }}
          persist-credentials: false

      # A shallow checkout lacks the change basis; fetch that one commit so `git diff $CI_KIT_BASE $CI_KIT_HEAD` works at
      # any depth. The token is handed to this one git call through its environment and never persisted. A failed
      # fetch only warns: a gate that never reads the base must not go red for it.
      - name: Fetch the change basis
        if: needs.plan.outputs.base != ''
        env:
          CI_KIT_BASE: ${{ needs.plan.outputs.base }}
          CI_KIT_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e "$CI_KIT_BASE^{commit}" 2>/dev/null && exit 0
          auth=$(printf 'x-access-token:%s' "$CI_KIT_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "$CI_KIT_BASE" \
            || echo "::warning::ci-kit: could not fetch the change basis $CI_KIT_BASE"

      - name: Set up Node
        if: matrix.gate.setup.node != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.gate.setup.node }}
          package-manager-cache: false

      - name: Enable pnpm
        if: matrix.gate.setup.pnpm
        run: corepack enable

      # The package cache (docs/adopting.md, "Package cache"). On GitHub's Linux runners the mirror can serve 100 kB/s, and
      # a large TeX set then holds the setup step past its bound: apt downloads into a directory the Actions cache
      # restores, filled by the default branch's warm job (package-cache, below) for this image and apt set. A miss
      # downloads from the mirror as before; apt still resolves every package and fetches what the directory lacks.
      # Self-hosted runners keep their own apt configuration: their images carry the packages.
      - name: Point apt at the package cache
        id: apt-cache
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && needs.plan.outputs.apt_cache != '' && join(matrix.gate.setup.apt, '') != ''
        env:
          CI_KIT_APT_CACHE: ${{ needs.plan.outputs.apt_cache }}
        # apt-get keeps what it downloads (only the apt command deletes it). Downloads run as root: the _apt sandbox user
        # cannot enter the runner's home. The key names the image, whose installed packages decide what apt fetches.
        run: &apt-cache-dir |
          dir=$RUNNER_TEMP/ci-kit-apt
          mkdir -p "$dir"
          printf 'Dir::Cache::Archives "%s/";\nAPT::Sandbox::User "root";\n' "$dir" | sudo tee /etc/apt/apt.conf.d/90ci-kit-package-cache >/dev/null
          prefix=ci-kit-apt-1-$ImageOS-$RUNNER_ARCH-
          {
            echo "key=$prefix$CI_KIT_APT_CACHE-$ImageVersion"
            echo "set=$prefix$CI_KIT_APT_CACHE-"
            echo "any=$prefix"
            echo "partial=ci-kit-apt-1-partial-$ImageOS-$RUNNER_ARCH-$CI_KIT_APT_CACHE-"
            echo "resume=ci-kit-apt-1-partial-$ImageOS-$RUNNER_ARCH-$CI_KIT_APT_CACHE-$ImageVersion-"
          } >> "$GITHUB_OUTPUT"

      # The packages, and the files apt had begun when a warm job was cut short, which apt resumes (a name is one
      # version's file, so a partial one is a prefix of it). An older image's entry, or another apt set's, still serves
      # every package whose version the mirror has not moved; last, what a warm job cut short had downloaded.
      - name: Restore the package cache
        if: steps.apt-cache.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/ci-kit-apt/*.deb
            ${{ runner.temp }}/ci-kit-apt/partial/*.deb
          key: ${{ steps.apt-cache.outputs.key }}
          restore-keys: |
            ${{ steps.apt-cache.outputs.set }}
            ${{ steps.apt-cache.outputs.any }}
            ${{ steps.apt-cache.outputs.partial }}

      # apt takes a file already in its archive directory on its name and size alone, never checking the hash the signed
      # index gives it (apt 2.8.2, acquire-item.cc, pkgAcqArchive), so an entry is trusted no further than the index:
      # against fresh lists, a restored package whose hash differs, or that the index does not know, is deleted and
      # downloaded again. A file in partial/ needs no check: apt hashes a resumed download whole.
      - name: Check the restored packages against the index
        if: steps.apt-cache.outcome == 'success'
        run: &apt-cache-check |
          shopt -s nullglob
          dir=$RUNNER_TEMP/ci-kit-apt
          debs=("$dir"/*.deb)
          (( ${#debs[@]} )) || exit 0
          if ! sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30; then
            echo "::warning::ci-kit: apt could not update its index, so the restored packages are not used"
            sudo rm -f "${debs[@]}"
            exit 0
          fi
          start=$SECONDS
          specs=()
          for deb in "${debs[@]}"; do
            IFS=_ read -r pkg version _ <<<"${deb##*/}"
            specs+=("$pkg=${version//%3a/:}")
          done
          # The index's hash of each version, by package and version: apt's file name for it, package_version_arch.deb (an
          # epoch's colon written %3a), names the architecture as built (amd64v3 on Ubuntu 26.04) and not as indexed.
          # apt-cache fails for a version the index lacks, and still prints the others.
          expected=$({ apt-cache show "${specs[@]}" 2>/dev/null || true; } | awk '
            function flush() { if (p != "") print s " " p "=" v; p = v = s = "" }
            /^Package: / { p = $2 } /^Version: / { v = $2 } /^SHA256: / { s = $2 }
            /^$/ { flush() } END { flush() }')
          dropped=0
          while read -r hash name; do
            IFS=_ read -r pkg version _ <<<"$name"
            grep -qxF "$hash $pkg=${version//%3a/:}" <<<"$expected" && continue
            echo "ci-kit: $name does not match the index; apt downloads it again"
            sudo rm -f "$dir/$name"
            dropped=$((dropped + 1))
          done < <(cd "$dir" && sha256sum -- *.deb)
          echo "ci-kit: checked ${#debs[@]} restored packages against the index in $((SECONDS - start)) s, dropped $dropped"

      - name: Apply CI environment
        if: join(matrix.gate.setup.apt, '') != '' || join(matrix.gate.setup.brew, '') != '' || join(matrix.gate.setup.cask, '') != '' || matrix.gate.setup.script != ''
        # A bound of its own, so a stalled package mirror fails this step instead of spending the gate's whole timeout.
        timeout-minutes: 20
        uses: SSFSKIM/ci-kit/setup@v1

      # build_cache: gha (docs/adopting.md, "Build cache"). The runner hands the cache service's token and URLs to JS
      # actions only, never to run: steps, so this step exports them for the rest of the job: what buildx fills a
      # type=gha cache's token, url, url_v2 and version from (docker/buildx build/opt.go, addGithubToken). The hosted
      # runners' Docker uses the containerd image store, whose default builder exports a type=gha cache itself.
      # CI_KIT_BUILD_CACHE_WRITE tells the command to write the cache too: on the default branch only (plan.mjs).
      - name: Expose the build cache
        if: matrix.gate.build_cache == 'gha'
        uses: actions/github-script@v9
        env:
          CI_KIT_CACHE_WRITE: ${{ needs.plan.outputs.cache_write }}
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
            core.exportVariable('CI_KIT_BUILD_CACHE', 'gha');
            if (process.env.CI_KIT_CACHE_WRITE === 'true') core.exportVariable('CI_KIT_BUILD_CACHE_WRITE', '1');

      - name: Install
        if: matrix.gate.setup.install != ''
        env:
          CI_KIT_BASE: ${{ needs.plan.outputs.base }}
          CI_KIT_HEAD: ${{ github.sha }}
          CI_KIT_INSTALL: ${{ matrix.gate.setup.install }}
        # Retried once after 30 s, as the setup action retries it (setup/apply.mjs): an install's downloads fail for a
        # minute at a time.
        run: |
          bash -eo pipefail -c "$CI_KIT_INSTALL" || {
            echo "::warning::ci-kit: the install failed; retrying it once in 30 s (its output above has the failure)"
            sleep 30
            bash -eo pipefail -c "$CI_KIT_INSTALL"
          }

      - name: Run ${{ matrix.gate.name }}
        env:
          CI_KIT_BASE: ${{ needs.plan.outputs.base }}
          CI_KIT_HEAD: ${{ github.sha }}
          CI_KIT_RUN: ${{ matrix.gate.run }}
        run: bash -eo pipefail -c "$CI_KIT_RUN"

      - name: Upload artifacts
        if: failure() && join(matrix.gate.artifacts, '') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.gate.name }}
          path: ${{ join(matrix.gate.artifacts, fromJSON('"\n"')) }}
          if-no-files-found: ignore

  # The package cache's warm job (docs/adopting.md, "Package cache"): on the default branch, whose entries every ref
  # reads (a ci/** ref's would serve only that ref), it downloads the declared apt set once per image and saves it. It
  # downloads without installing, the setup step's way (installed names are left as they are), and drops what an older
  # entry held that the set no longer needs, so the entry stays the set's size. It is not a gate: the verdict does not
  # wait for it, and a failure (a mirror too slow for its bound) leaves the run green; the next warm tries again.
  package-cache:
    name: package cache
    needs: plan
    if: needs.plan.outputs.apt_warm != '[]' && needs.plan.outputs.apt_warm != ''
    runs-on: ubuntu-latest # the hosted lane's runner (plan/select.mjs), whose image the gates' key names
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Point apt at the package cache
        id: apt-cache
        env:
          CI_KIT_APT_CACHE: ${{ needs.plan.outputs.apt_cache }}
        run: *apt-cache-dir

      - name: Look up the package cache
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/ci-kit-apt/*.deb
            ${{ runner.temp }}/ci-kit-apt/partial/*.deb
          key: ${{ steps.apt-cache.outputs.key }}
          lookup-only: true

      # This image's cut-short download first, which holds what it restored and what it fetched; then as a gate restores,
      # an older image's cut-short download included, so that a slow mirror across an image change still converges.
      - name: Restore an older package cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/ci-kit-apt/*.deb
            ${{ runner.temp }}/ci-kit-apt/partial/*.deb
          key: ${{ steps.apt-cache.outputs.key }}
          restore-keys: |
            ${{ steps.apt-cache.outputs.resume }}
            ${{ steps.apt-cache.outputs.set }}
            ${{ steps.apt-cache.outputs.any }}
            ${{ steps.apt-cache.outputs.partial }}

      # Before the entry seeds a new one: what it holds is saved again.
      - name: Check the restored packages against the index
        if: steps.lookup.outputs.cache-hit != 'true'
        run: *apt-cache-check

      # Bounded below the job, so that a mirror too slow to finish still leaves what it served for the next warm.
      - name: Download the declared packages
        id: download
        if: steps.lookup.outputs.cache-hit != 'true'
        timeout-minutes: 45
        env:
          CI_KIT_APT: ${{ needs.plan.outputs.apt_warm }}
        run: |
          read -r -a packages <<<"$(jq -r 'join(" ")' <<<"$CI_KIT_APT")"
          acquire=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          install=(install -y --no-install-recommends --no-upgrade)
          sudo apt-get update "${acquire[@]}"
          # What the set needs at the mirror's versions: the packages apt would fetch into an empty directory.
          empty=$(mktemp -d)
          mkdir "$empty/partial"
          needed=$(sudo apt-get "${install[@]}" --print-uris -qq -o "Dir::Cache::Archives=$empty/" "${packages[@]}" | awk '{print $2}')
          shopt -s nullglob
          for deb in "$RUNNER_TEMP"/ci-kit-apt/*.deb "$RUNNER_TEMP"/ci-kit-apt/partial/*.deb; do
            grep -qxF "${deb##*/}" <<<"$needed" || sudo rm -f "$deb"
          done
          # In a process group of its own, recorded, and its return recorded: a timeout ends this bash but not the apt-get
          # under sudo, and the next step stops that group, and only after a timeout.
          state=$RUNNER_TEMP/ci-kit-apt-download
          rm -f "$state.pgid" "$state.exit"
          status=0
          sudo setsid --wait bash -c 'echo $$ > "$0"; exec "$@"' "$state.pgid" \
            apt-get "${install[@]}" --download-only "${acquire[@]}" "${packages[@]}" || status=$?
          echo "$status" > "$state.exit"
          (( status == 0 )) || exit "$status"
          du -ch "$RUNNER_TEMP"/ci-kit-apt/*.deb | tail -n 1

      # A step's timeout ends its bash, not the apt-get it started under sudo, which goes on writing the file it had begun
      # (tar then fails: "file changed as we read it"). Only the download's own group is stopped, and only when it never
      # returned: an apt that failed has exited, and any other apt on the machine is not the warm's. And apt keeps
      # partial/ root's alone, unreadable to a save.
      - name: Let the cache read the unfinished downloads
        if: always() && steps.lookup.outputs.cache-hit != 'true'
        env:
          CI_KIT_DOWNLOAD: ${{ steps.download.outcome }}
        run: |
          state=$RUNNER_TEMP/ci-kit-apt-download
          if [ "$CI_KIT_DOWNLOAD" != success ] && [ -s "$state.pgid" ] && [ ! -e "$state.exit" ]; then
            pgid=$(cat "$state.pgid")
            sudo kill -TERM -- "-$pgid" 2>/dev/null || true
            for _ in $(seq 30); do
              sudo kill -0 -- "-$pgid" 2>/dev/null || { pgid=; break; }
              sleep 1
            done
            [ -z "$pgid" ] || sudo kill -KILL -- "-$pgid" 2>/dev/null || true
          fi
          if [ -d "$RUNNER_TEMP/ci-kit-apt/partial" ]; then sudo chmod -R a+rX "$RUNNER_TEMP/ci-kit-apt/partial"; fi

      - name: Save the package cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/ci-kit-apt/*.deb
            ${{ runner.temp }}/ci-kit-apt/partial/*.deb
          key: ${{ steps.apt-cache.outputs.key }}

      # Under keys of their own, which the next warm resumes from, and a gate falls back to only when nothing else
      # matches: a set cut short must not stand in for a complete one. Each is superseded by the next and ages out.
      - name: Save the partial download
        if: always() && (steps.download.outcome == 'failure' || steps.download.outcome == 'cancelled')
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/ci-kit-apt/*.deb
            ${{ runner.temp }}/ci-kit-apt/partial/*.deb
          key: ${{ steps.apt-cache.outputs.resume }}${{ github.run_id }}-${{ github.run_attempt }}

  verdict:
    name: verdict
    needs: [plan, gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          PLAN: ${{ needs.plan.result }}
          GATES: ${{ needs.gate.result }}
          COUNT: ${{ needs.plan.outputs.count }}
          NOTE: ${{ needs.plan.outputs.note }}
        run: |
          if [ "$PLAN" != success ]; then echo "::error::the plan did not succeed ($PLAN)"; exit 1; fi
          if [ "$COUNT" = 0 ]; then echo "$NOTE"; exit 0; fi
          if [ "$GATES" != success ]; then echo "::error::not every gate passed ($GATES)"; exit 1; fi
          echo "all $COUNT selected gates passed"
