# The ci-kit reusable workflow (spec §1). Callers use it through the two-file onboarding in docs/adopting.md:
#   jobs: {ci: {uses: SSFSKIM/ci-kit/.github/workflows/gates.yml@v1, secrets: inherit}}
# plan reads the caller's .github/ci-kit.yml and selects gates; gate runs one matrix job per selected gate;
# verdict is the one stable check, green only when every selected gate is.
name: gates

on:
  workflow_call:

permissions:
  contents: read

# A newer push to a PR cancels the older run; every other run (each ci-gate call has its own ref) has a group of its own.
concurrency:
  group: ci-kit-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gates: ${{ steps.plan.outputs.gates }}
      count: ${{ steps.plan.outputs.count }}
      pool: ${{ steps.plan.outputs.pool }}
      note: ${{ steps.plan.outputs.note }}
      base: ${{ steps.plan.outputs.base }}
      cache_write: ${{ steps.plan.outputs.cache_write }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the change basis needs the base's history
          filter: blob:none
          persist-credentials: false

      # Inside a reusable workflow `./` is the caller's repo, so the planner is checked out from the kit at the
      # very commit this workflow file came from: planner and workflow always run at the same version.
      - name: Check out the kit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-kit
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install the planner
        working-directory: .ci-kit
        run: npm ci --omit=dev --no-audit --no-fund --loglevel=error

      - name: Plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_KIT_CONFIG: .github/ci-kit.yml
          CI_KIT_PRIVATE: ${{ github.event.repository.private }}
          CI_KIT_GATES: ${{ github.event.inputs.gates }}
          CI_KIT_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          CI_KIT_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          fail() { echo "::error::${1//%/%25}"; exit 2; }
          case $EVENT_NAME in
            pull_request) export CI_KIT_EVENT=pr CI_KIT_BASE=$PR_BASE CI_KIT_HEAD=$PR_HEAD ;;
            push)
              if [[ $GITHUB_REF == refs/heads/ci/* ]]; then
                base=$(git rev-parse --verify "origin/$DEFAULT_BRANCH") || fail "ci-kit: no default branch origin/$DEFAULT_BRANCH to diff against"
                export CI_KIT_EVENT=ci-ref CI_KIT_BASE=$base CI_KIT_HEAD=$GITHUB_SHA
              elif [[ $GITHUB_REF == "refs/heads/$DEFAULT_BRANCH" ]]; then
                # A merge seeds the build cache (docs/adopting.md, "Build cache"): the build_cache gates whose paths the
                # push changed, against the branch's tip before it. When that tip is all zeros (a new branch), absent
                # from the checkout or not an ancestor (a force push), the base stays empty and every one of them seeds.
                base=
                if [[ ! $PUSH_BEFORE =~ ^0+$ ]] && git merge-base --is-ancestor "$PUSH_BEFORE" "$GITHUB_SHA" 2>/dev/null; then
                  base=$PUSH_BEFORE
                fi
                export CI_KIT_EVENT=push CI_KIT_BASE=$base CI_KIT_HEAD=$GITHUB_SHA
              else
                fail "ci-kit: a push is planned only on ci/** refs and the default branch, not $GITHUB_REF"
              fi ;;
            workflow_dispatch) export CI_KIT_EVENT=dispatch CI_KIT_BASE= CI_KIT_HEAD= ;;
            # The build cache's seeding run (docs/adopting.md, "Build cache"). A schedule has no event payload, so the
            # repository's visibility and default branch come from the API.
            schedule)
              repo=$(curl -fsS --retry 3 -H "Authorization: Bearer $CI_KIT_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY") \
                || fail "ci-kit: a schedule could not read $GITHUB_REPOSITORY's visibility and default branch"
              CI_KIT_PRIVATE=$(jq -r .private <<<"$repo") DEFAULT_BRANCH=$(jq -r .default_branch <<<"$repo")
              export CI_KIT_PRIVATE CI_KIT_EVENT=schedule CI_KIT_BASE= CI_KIT_HEAD= ;;
            *) fail "ci-kit: event $EVENT_NAME is not planned (pull_request, push to ci/** or the default branch, workflow_dispatch, schedule)" ;;
          esac
          unset CI_KIT_TOKEN
          # The planner writes the build cache only on the default branch.
          export CI_KIT_REF=$GITHUB_REF CI_KIT_DEFAULT_BRANCH=$DEFAULT_BRANCH
          # The gates' CI_KIT_BASE: where the commit they check out ($GITHUB_SHA) left the base, so that a two-dot
          # `git diff $CI_KIT_BASE $CI_KIT_HEAD` is the change. Empty when the event has no change basis.
          gate_base=
          if [[ -n $CI_KIT_BASE ]]; then
            gate_base=$(git merge-base "$CI_KIT_BASE" "$GITHUB_SHA") || fail "ci-kit: no merge-base of $CI_KIT_BASE and $GITHUB_SHA"
          fi
          status=0
          node .ci-kit/plan/plan.mjs > "$RUNNER_TEMP/plan.json" 2> "$RUNNER_TEMP/plan.err" || status=$?
          cat "$RUNNER_TEMP/plan.err" >&2
          if (( status != 0 )); then
            # Each planner message becomes an error annotation, which ci-gate reads back and prints.
            while IFS= read -r line; do
              [[ $line == ci-kit:* ]] && echo "::error::${line//%/%25}"
            done < "$RUNNER_TEMP/plan.err"
            exit "$status"
          fi
          jq . "$RUNNER_TEMP/plan.json"
          {
            echo "gates=$(jq -c .gates "$RUNNER_TEMP/plan.json")"
            echo "count=$(jq '.gates | length' "$RUNNER_TEMP/plan.json")"
            echo "pool=$(jq .pool "$RUNNER_TEMP/plan.json")"
            echo "note=$(jq -r .note "$RUNNER_TEMP/plan.json")"
            echo "base=$gate_base"
            echo "cache_write=$(jq .cache_write "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_OUTPUT"

      # A pool gate needs the pool box: ensure creates it if none exists, without waiting for it to boot (spec §3).
      # It runs from the kit checkout, so it is at this workflow's version, like the planner.
      - name: Pool
        if: steps.plan.outputs.pool == 'true'
        uses: ./.ci-kit/pool-ensure

  gate:
    name: ${{ matrix.gate.name }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.plan.outputs.gates) }}
    runs-on: ${{ matrix.gate.runs_on }}
    timeout-minutes: ${{ matrix.gate.timeout }}
    env: ${{ matrix.gate.env }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.gate.setup.fetch_depth }}
          persist-credentials: false

      # A shallow checkout lacks the change basis; fetch that one commit so `git diff $CI_KIT_BASE $CI_KIT_HEAD` works at
      # any depth. The token is handed to this one git call through its environment and never persisted. A failed
      # fetch only warns: a gate that never reads the base must not go red for it.
      - name: Fetch the change basis
        if: needs.plan.outputs.base != ''
        env:
          CI_KIT_BASE: ${{ needs.plan.outputs.base }}
          CI_KIT_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e "$CI_KIT_BASE^{commit}" 2>/dev/null && exit 0
          auth=$(printf 'x-access-token:%s' "$CI_KIT_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "$CI_KIT_BASE" \
            || echo "::warning::ci-kit: could not fetch the change basis $CI_KIT_BASE"

      - name: Set up Node
        if: matrix.gate.setup.node != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.gate.setup.node }}
          package-manager-cache: false

      - name: Enable pnpm
        if: matrix.gate.setup.pnpm
        run: corepack enable

      - name: Apply CI environment
        if: join(matrix.gate.setup.apt, '') != '' || join(matrix.gate.setup.brew, '') != '' || join(matrix.gate.setup.cask, '') != '' || matrix.gate.setup.script != ''
        uses: SSFSKIM/ci-kit/setup@v1

      # build_cache: gha (docs/adopting.md, "Build cache"). The runner hands the cache service's token and URLs to JS
      # actions only, never to run: steps, so this step exports them for the rest of the job: what buildx fills a
      # type=gha cache's token, url, url_v2 and version from (docker/buildx build/opt.go, addGithubToken). The hosted
      # runners' Docker uses the containerd image store, whose default builder exports a type=gha cache itself.
      # CI_KIT_BUILD_CACHE_WRITE tells the command to write the cache too: on the default branch only (plan.mjs).
      - name: Expose the build cache
        if: matrix.gate.build_cache == 'gha'
        uses: actions/github-script@v9
        env:
          CI_KIT_CACHE_WRITE: ${{ needs.plan.outputs.cache_write }}
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
            core.exportVariable('CI_KIT_BUILD_CACHE', 'gha');
            if (process.env.CI_KIT_CACHE_WRITE === 'true') core.exportVariable('CI_KIT_BUILD_CACHE_WRITE', '1');

      - name: Install
        if: matrix.gate.setup.install != ''
        env:
          CI_KIT_BASE: ${{ needs.plan.outputs.base }}
          CI_KIT_HEAD: ${{ github.sha }}
          CI_KIT_INSTALL: ${{ matrix.gate.setup.install }}
        run: bash -eo pipefail -c "$CI_KIT_INSTALL"

      - name: Run ${{ matrix.gate.name }}
        env:
          CI_KIT_BASE: ${{ needs.plan.outputs.base }}
          CI_KIT_HEAD: ${{ github.sha }}
          CI_KIT_RUN: ${{ matrix.gate.run }}
        run: bash -eo pipefail -c "$CI_KIT_RUN"

      - name: Upload artifacts
        if: failure() && join(matrix.gate.artifacts, '') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.gate.name }}
          path: ${{ join(matrix.gate.artifacts, fromJSON('"\n"')) }}
          if-no-files-found: ignore

  verdict:
    name: verdict
    needs: [plan, gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          PLAN: ${{ needs.plan.result }}
          GATES: ${{ needs.gate.result }}
          COUNT: ${{ needs.plan.outputs.count }}
          NOTE: ${{ needs.plan.outputs.note }}
        run: |
          if [ "$PLAN" != success ]; then echo "::error::the plan did not succeed ($PLAN)"; exit 1; fi
          if [ "$COUNT" = 0 ]; then echo "$NOTE"; exit 0; fi
          if [ "$GATES" != success ]; then echo "::error::not every gate passed ($GATES)"; exit 1; fi
          echo "all $COUNT selected gates passed"
