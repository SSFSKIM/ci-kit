# The pool's guard (spec §3 Guard): the backstop, every 10 minutes. GitHub's cron can run late; the main path is
# ensure and the agent. Scheduled workflows run from the default branch only. GitHub registers the schedule when
# this file changes there; after M5's merge (2026-10-16) no scheduled run came for over 85 minutes, and a commit
# that touches this file is the documented way to make GitHub register it again.
name: pool-guard
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pool-guard
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --omit=dev --no-audit --no-fund --loglevel=error
      - name: Guard
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CI_KIT_APP_ID: ${{ secrets.CI_KIT_APP_ID }}
          CI_KIT_APP_KEY: ${{ secrets.CI_KIT_APP_KEY }}
        run: node pool/guard.mjs
