# Compatibility for callers on @v1; the GCE/EC2 launcher observes GitHub's queue itself.
name: ci-kit pool ensure
description: Compatibility no-op; the ephemeral-VM launcher provisions runners automatically.
inputs:
  hcloud-token:
    description: Deprecated and ignored; existing callers may omit this input and remove their secret.
    required: false
    default: ''
outputs:
  result:
    description: Always none; this action no longer provisions capacity.
    value: ${{ steps.ensure.outputs.result }}
runs:
  using: composite
  steps:
    - id: ensure
      shell: bash
      run: node "$GITHUB_ACTION_PATH/ensure.mjs"
